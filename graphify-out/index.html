<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sagittarius — Codebase Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0b0f;--surface:#111318;--surface2:#181b22;--border:#1e2330;
    --accent:#6366f1;--accent2:#8b5cf6;--accent3:#06b6d4;
    --text:#e2e8f0;--muted:#64748b;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;
  }
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .logo-text{font-size:15px;font-weight:700;letter-spacing:-0.3px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:400}
  .stats{display:flex;gap:20px;margin-left:auto;font-size:12px}
  .stat{display:flex;flex-direction:column;align-items:flex-end}
  .stat-val{font-weight:700;font-size:15px;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.5px}
  .controls{display:flex;gap:8px;align-items:center;margin-left:16px;padding-left:16px;border-left:1px solid var(--border)}
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
  .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .search-wrap{position:relative}
  .search{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px 6px 32px;border-radius:6px;font-size:12px;width:200px;font-family:inherit;outline:none;transition:border-color .15s}
  .search:focus{border-color:var(--accent)}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
  main{display:flex;flex:1;overflow:hidden}
  #canvas{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%}
  .node circle{cursor:pointer;stroke-width:2;transition:r .2s}
  .node text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--text);pointer-events:none;text-shadow:0 1px 4px #000a}
  .link{stroke-opacity:.5;stroke-width:1.2}
  .tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;max-width:280px;z-index:100;box-shadow:0 8px 32px #0008}
  .tooltip-title{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--text)}
  .tooltip-row{display:flex;gap:8px;margin-top:4px;align-items:flex-start}
  .tooltip-lbl{color:var(--muted);min-width:70px;font-size:11px}
  .tooltip-val{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;word-break:break-all}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;margin-top:2px}
  aside{width:280px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
  .panel-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);padding:16px 16px 8px}
  .legend{padding:0 16px 16px}
  .legend-item{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;cursor:pointer;border-radius:6px;padding:4px 6px;transition:background .15s}
  .legend-item:hover{background:var(--surface2)}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .node-list{flex:1;overflow-y:auto}
  .node-item{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;display:flex;align-items:flex-start;gap:10px}
  .node-item:hover{background:var(--surface2)}
  .node-item.active{background:#6366f120;border-left:3px solid var(--accent)}
  .node-item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
  .node-item-name{font-size:12px;font-weight:500;font-family:'JetBrains Mono',monospace;word-break:break-all}
  .node-item-file{font-size:10px;color:var(--muted);margin-top:2px;word-break:break-all}
  .divider{height:1px;background:var(--border);margin:0 16px}
  .filter-btns{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 12px}
  .filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .footer-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:11px;color:var(--muted);display:flex;gap:16px;box-shadow:0 4px 20px #0006;pointer-events:none}
  .footer-bar span{display:flex;align-items:center;gap:5px}
  .key{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text)}
  .glow{filter:drop-shadow(0 0 6px var(--accent))}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">Sagittarius</div>
      <div class="logo-sub">Codebase Graph</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-val" id="s-nodes">—</span><span class="stat-lbl">Nodes</span></div>
    <div class="stat"><span class="stat-val" id="s-edges">—</span><span class="stat-lbl">Edges</span></div>
    <div class="stat"><span class="stat-val" id="s-comm">—</span><span class="stat-lbl">Communities</span></div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search" id="search" placeholder="Search nodes…" autocomplete="off"/>
    </div>
    <button class="btn" id="btn-reset">Reset View</button>
    <button class="btn" id="btn-freeze">Freeze</button>
  </div>
</header>
<main>
  <div id="canvas">
    <svg id="svg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="footer-bar">
      <span><kbd class="key">Scroll</kbd> Zoom</span>
      <span><kbd class="key">Drag</kbd> Pan</span>
      <span><kbd class="key">Click</kbd> Select</span>
      <span><kbd class="key">Dbl-click</kbd> Focus</span>
    </div>
  </div>
  <aside>
    <div class="panel-title">Communities</div>
    <div class="legend" id="legend"></div>
    <div class="divider"></div>
    <div class="panel-title">Filter</div>
    <div class="filter-btns" id="filter-btns"></div>
    <div class="divider"></div>
    <div class="panel-title">Nodes <span id="node-count" style="color:var(--accent);margin-left:4px"></span></div>
    <div class="node-list" id="node-list"></div>
  </aside>
</main>

<script>
const COMMUNITY_COLORS = [
  '#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444',
  '#ec4899','#14b8a6','#f97316','#84cc16','#a855f7','#22d3ee',
  '#fb923c','#4ade80','#e879f9','#38bdf8','#facc15','#f87171',
  '#34d399','#a78bfa','#60a5fa','#fb7185','#fbbf24','#2dd4bf',
  '#c084fc','#67e8f9','#86efac','#fcd34d'
];

const PACKAGE_COLORS = {
  'apps/web': '#6366f1',
  'apps/worker': '#f59e0b',
  'packages/db': '#10b981',
  'packages/queue': '#06b6d4',
  'packages/config': '#8b5cf6',
  'packages/shared-types': '#ec4899',
};

function getPackage(sourceFile) {
  if (!sourceFile) return 'other';
  const f = sourceFile.replace(/\\/g, '/');
  for (const k of Object.keys(PACKAGE_COLORS)) {
    if (f.startsWith(k)) return k;
  }
  return 'other';
}

async function main() {
  const graphData = await fetch('graph.json').then(r => r.json());
  const nodes = graphData.nodes.map(n => ({...n}));
  const links = graphData.links.map(l => ({...l}));

  const communities = [...new Set(nodes.map(n => n.community))].sort((a,b)=>a-b);
  const packages = [...new Set(nodes.map(n => getPackage(n.source_file)))];

  document.getElementById('s-nodes').textContent = nodes.length;
  document.getElementById('s-edges').textContent = links.length;
  document.getElementById('s-comm').textContent = communities.length;

  // Legend
  const legend = document.getElementById('legend');
  Object.entries(PACKAGE_COLORS).forEach(([pkg, color]) => {
    const cnt = nodes.filter(n => getPackage(n.source_file) === pkg).length;
    if (cnt === 0) return;
    const el = document.createElement('div');
    el.className = 'legend-item';
    el.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span style="flex:1">${pkg}</span><span style="color:var(--muted);font-size:11px">${cnt}</span>`;
    el.addEventListener('click', () => filterByPackage(pkg));
    legend.appendChild(el);
  });

  // Filter buttons
  const filterBtns = document.getElementById('filter-btns');
  const relations = ['all', ...new Set(links.map(l => l.relation))];
  let activeRelation = 'all';
  relations.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (r === 'all' ? ' active' : '');
    btn.textContent = r;
    btn.addEventListener('click', () => {
      activeRelation = r;
      filterBtns.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateLinkVisibility();
    });
    filterBtns.appendChild(btn);
  });

  // D3 Force
  const svgEl = document.getElementById('svg');
  const rect = svgEl.parentElement.getBoundingClientRect();
  const W = rect.width, H = rect.height;

  const svg = d3.select('#svg');
  const defs = svg.append('defs');

  // Gradient background
  const radial = defs.append('radialGradient').attr('id','bg-grad').attr('cx','50%').attr('cy','50%').attr('r','50%');
  radial.append('stop').attr('offset','0%').attr('stop-color','#111827');
  radial.append('stop').attr('offset','100%').attr('stop-color','#0a0b0f');

  svg.append('rect').attr('width','100%').attr('height','100%').attr('fill','url(#bg-grad)');

  const zoom = d3.zoom().scaleExtent([0.1,4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  const g = svg.append('g');

  // Marker arrow
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',18).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill','#334155');

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(80).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(20));

  // Draw links
  const link = g.append('g').selectAll('line')
    .data(links).join('line')
    .attr('class','link')
    .attr('stroke', d => d.relation === 'calls' ? '#6366f155' : '#334155')
    .attr('stroke-dasharray', d => d.relation === 'calls' ? '4,2' : null)
    .attr('marker-end','url(#arrow)');

  // Draw nodes
  const node = g.append('g').selectAll('.node')
    .data(nodes).join('g')
    .attr('class','node')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x;d.fy=d.y; })
      .on('drag', (e,d) => { d.fx=e.x;d.fy=e.y; })
      .on('end', (e,d) => { if(!e.active) simulation.alphaTarget(0); if(!frozen){d.fx=null;d.fy=null;} }));

  const isFile = d => !d.label.includes('()');
  node.append('circle')
    .attr('r', d => isFile(d) ? 10 : 7)
    .attr('fill', d => getPackage(d.source_file) in PACKAGE_COLORS ? PACKAGE_COLORS[getPackage(d.source_file)] : '#475569')
    .attr('fill-opacity', 0.85)
    .attr('stroke', d => getPackage(d.source_file) in PACKAGE_COLORS ? PACKAGE_COLORS[getPackage(d.source_file)] : '#475569')
    .attr('stroke-opacity', 0.4);

  node.append('text')
    .attr('dy', d => isFile(d) ? -14 : -11)
    .attr('text-anchor','middle')
    .text(d => d.label.length > 22 ? d.label.slice(0,20)+'…' : d.label)
    .attr('opacity', d => isFile(d) ? 1 : 0.7);

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  node.on('mouseover', (e, d) => {
    const pkg = getPackage(d.source_file);
    const color = PACKAGE_COLORS[pkg] || '#475569';
    const edges = links.filter(l => l.source.id === d.id || l.target.id === d.id).length;
    tooltip.innerHTML = `
      <div class="tooltip-title">${d.label}</div>
      <div class="tooltip-row"><span class="tooltip-lbl">File</span><span class="tooltip-val">${d.source_file}</span></div>
      <div class="tooltip-row"><span class="tooltip-lbl">Location</span><span class="tooltip-val">${d.source_location}</span></div>
      <div class="tooltip-row"><span class="tooltip-lbl">Package</span><span class="tooltip-val"><span class="badge" style="background:${color}22;color:${color}">${pkg}</span></span></div>
      <div class="tooltip-row"><span class="tooltip-lbl">Edges</span><span class="tooltip-val">${edges}</span></div>
      <div class="tooltip-row"><span class="tooltip-lbl">Community</span><span class="tooltip-val">${d.community}</span></div>
    `;
    tooltip.style.opacity = '1';
    moveTooltip(e);
  }).on('mousemove', moveTooltip).on('mouseout', () => { tooltip.style.opacity='0'; });

  function moveTooltip(e) {
    const cr = svgEl.parentElement.getBoundingClientRect();
    let x = e.clientX - cr.left + 16, y = e.clientY - cr.top - 20;
    if (x + 290 > cr.width) x = e.clientX - cr.left - 300;
    if (y + 200 > cr.height) y = e.clientY - cr.top - 180;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  // Click to highlight
  let selected = null;
  node.on('click', (e, d) => {
    e.stopPropagation();
    selected = selected === d.id ? null : d.id;
    updateHighlight();
    updateSidebar(d);
  });

  // Dblclick focus
  node.on('dblclick', (e, d) => {
    e.stopPropagation();
    const t = d3.zoomIdentity.translate(W/2 - d.x, H/2 - d.y).scale(1.5);
    svg.transition().duration(500).call(zoom.transform, t);
  });

  svg.on('click', () => { selected = null; updateHighlight(); clearSidebar(); });

  function updateHighlight() {
    if (!selected) {
      node.selectAll('circle').attr('opacity',1).attr('stroke-width',2);
      link.attr('stroke-opacity',0.5);
      return;
    }
    const connected = new Set([selected]);
    links.forEach(l => {
      const s = l.source.id || l.source, t = l.target.id || l.target;
      if (s === selected) connected.add(t);
      if (t === selected) connected.add(s);
    });
    node.selectAll('circle').attr('opacity', d => connected.has(d.id) ? 1 : 0.15).attr('stroke-width', d => d.id === selected ? 3 : 2);
    link.attr('stroke-opacity', l => {
      const s = l.source.id||l.source, t = l.target.id||l.target;
      return (s===selected||t===selected) ? 0.9 : 0.05;
    });
  }

  // Node list sidebar
  function renderNodeList(filtered) {
    const list = document.getElementById('node-list');
    document.getElementById('node-count').textContent = filtered.length;
    list.innerHTML = '';
    filtered.slice(0,200).forEach(d => {
      const pkg = getPackage(d.source_file);
      const color = PACKAGE_COLORS[pkg] || '#475569';
      const item = document.createElement('div');
      item.className = 'node-item';
      item.dataset.id = d.id;
      item.innerHTML = `<div class="node-item-dot" style="background:${color}"></div><div><div class="node-item-name">${d.label}</div><div class="node-item-file">${d.source_file}</div></div>`;
      item.addEventListener('click', () => {
        selected = d.id;
        updateHighlight();
        document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        // pan to node
        const nd = nodes.find(n => n.id === d.id);
        if (nd) {
          const t = d3.zoomIdentity.translate(W/2 - nd.x, H/2 - nd.y).scale(1.5);
          svg.transition().duration(400).call(zoom.transform, t);
        }
      });
      list.appendChild(item);
    });
  }

  function updateSidebar(d) {
    document.querySelectorAll('.node-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === d.id);
    });
  }
  function clearSidebar() {
    document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
  }

  renderNodeList(nodes);

  // Search
  let searchTerm = '';
  let pkgFilter = null;
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase();
    applyFilters();
  });

  function filterByPackage(pkg) {
    pkgFilter = pkgFilter === pkg ? null : pkg;
    applyFilters();
  }

  function applyFilters() {
    let filtered = nodes;
    if (searchTerm) filtered = filtered.filter(d => d.label.toLowerCase().includes(searchTerm) || (d.source_file||'').toLowerCase().includes(searchTerm));
    if (pkgFilter) filtered = filtered.filter(d => getPackage(d.source_file) === pkgFilter);
    const ids = new Set(filtered.map(d => d.id));
    node.selectAll('circle').attr('opacity', d => ids.has(d.id) ? 1 : 0.1);
    node.selectAll('text').attr('opacity', d => ids.has(d.id) ? (isFile(d)?1:0.7) : 0.05);
    renderNodeList(filtered);
  }

  function updateLinkVisibility() {
    link.attr('display', d => activeRelation === 'all' || d.relation === activeRelation ? null : 'none');
  }

  // Freeze
  let frozen = false;
  document.getElementById('btn-freeze').addEventListener('click', function() {
    frozen = !frozen;
    this.textContent = frozen ? 'Unfreeze' : 'Freeze';
    this.style.background = frozen ? 'var(--accent)' : '';
    this.style.color = frozen ? '#fff' : '';
    if (frozen) {
      simulation.stop();
      nodes.forEach(d => { d.fx=d.x; d.fy=d.y; });
    } else {
      nodes.forEach(d => { d.fx=null; d.fy=null; });
      simulation.alpha(0.3).restart();
    }
  });

  // Reset
  document.getElementById('btn-reset').addEventListener('click', () => {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(1));
    searchTerm = ''; pkgFilter = null; selected = null;
    document.getElementById('search').value = '';
    node.selectAll('circle').attr('opacity',1);
    node.selectAll('text').attr('opacity', d => isFile(d)?1:0.7);
    link.attr('stroke-opacity',0.5).attr('display',null);
    renderNodeList(nodes);
    updateHighlight();
    activeRelation='all';
    filterBtns.querySelectorAll('.filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  });

  // Tick
  simulation.on('tick', () => {
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

  // Initial zoom fit
  setTimeout(() => {
    svg.call(zoom.transform, d3.zoomIdentity.translate(W*0.05, H*0.05).scale(0.9));
  }, 800);
}

main();
</script>
</body>
</html>
